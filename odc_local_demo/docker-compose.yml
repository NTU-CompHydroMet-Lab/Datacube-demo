services:
  postgres:
    image: postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_DB: datacube
      POSTGRES_USER: datacube
      POSTGRES_PASSWORD: datacube
    ports:
      - "5432:5432"
    volumes:
      - odc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacube -d datacube"]
      interval: 5s
      timeout: 5s
      retries: 20

  odc:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOSTNAME: postgres
      DB_DATABASE: datacube
      DB_USERNAME: datacube
      DB_PASSWORD: datacube
      DATACUBE_CONFIG_PATH: /root/.datacube.conf
    ports:
      - "8888:8888"
    volumes:
      - ./data:/workspace/data
      - ./products:/workspace/products
      - ./datasets:/workspace/datasets
      - ./scripts:/workspace/scripts
      - ../notebooks:/workspace/notebooks
    working_dir: /workspace
    command: ["bash", "-lc", "sleep infinity"]

volumes:
  odc_postgres_data:
